name: clothing_shop
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & UI Utilities
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1 # Essential for loading product images smoothly
  
  # State Management (Choose BLoC or Riverpod - BLoC is great for robust e-commerce flows)
  flutter_bloc: ^8.1.6
  
  # Firebase Core & Services (Version locked for stability)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.3.8
  image_picker: ^1.0.7
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

